version: 2

models:
  - name: stg_local_bike__brands
    description: "This model contains information about brands"
    columns:
      - name: brand_id
        description: "Primary key, unique identifier for each brand."
        tests:
            - unique
            - not_null


  - name: stg_local_bike__categories
    description: "This model contains information about categories"
    columns:
      - name: category_id
        description: "Primary key, unique identifier for each category."
        tests:
            - unique
            - not_null

  - name: stg_local_bike__customers
    description: "This model contains information about Local Bike customers."
    
    columns:
      - name: customer_id
        description: "Primary key, unique identifier for each customer."
        tests:
            - unique
            - not_null

  - name: stg_local_bike__order_items
    description: "This model contains information about order items."
    columns:
      - name: order_item_id
        description: "Primary key, unique identifier for each order_item: generated by concatenating order_id and item_id."
        tests:
            - unique
            - not_null
  
      - name: order_id
        description: "Foreign key linking the order to the corresponding order item."
        tests:
          - relationships:
              to: ref('stg_local_bike__orders')
              field: order_id

      - name: product_id
        description: "Foreign key linking the product to the corresponding order item."
        tests:
          - relationships:
              to: ref('stg_local_bike__products')
              field: product_id
      

  - name: stg_local_bike__orders
    description: "This model contains details of Local bike orders informations."
    columns:
      - name: order_id
        description: "Primary key, unique identifier for each order."
        tests:
            - unique
            - not_null
        
      - name: customer_id
        description: "Foreign key linking the customer to the corresponding order."
        tests:
          - relationships:
              to: ref('stg_local_bike__customers')
              field: customer_id

      - name: store_id
        description: "Foreign key linking the store to the corresponding order."
        tests:
          - relationships:
              to: ref('stg_local_bike__stores')
              field: store_id

      - name: staff_id
        description: "Foreign key linking the staff to the corresponding order."
        tests:
          - relationships:
              to: ref('stg_local_bike__staffs')
              field: staff_id
      

  - name: stg_local_bike__products
    description: "This model contains information about the products."
    columns:
      - name: product_id
        description: "Primary key, unique identifier for each product."
        tests:
            - unique
            - not_null
      
      - name: brand_id
        description: "Foreign key linking the brand to the corresponding product."
        tests:
          - relationships:
              to: ref('stg_local_bike__brands')
              field: brand_id

      - name: category_id
        description: "Foreign key linking the brand to the corresponding category."
        tests:
          - relationships:
              to: ref('stg_local_bike__categories')
              field: category_id

  - name: stg_local_bike__staffs
    description: "This model contains staff informations."
    columns:
      - name: staff_id
        description: "Primary key, unique identifier for each staff."
        tests:
            - unique
            - not_null
      
      - name: store_id
        description: "Foreign key linking the staff to the corresponding store."
        tests:
          - relationships:
              to: ref('stg_local_bike__stores')
              field: store_id

  - name: stg_local_bike__stocks
    description: "This model contains stocks informations."
    columns:
      - name: stock_id
        description: "Primary key, unique identifier for each stock : generated by concatenating store_id and product_id."
        tests:
            - unique
            - not_null
      
      - name: store_id
        description: "Foreign key linking the stock to the corresponding store."
        tests:
          - relationships:
              to: ref('stg_local_bike__stores')
              field: store_id
      
      - name: product_id
        description: "Foreign key linking the stock to the corresponding product."
        tests:
          - relationships:
              to: ref('stg_local_bike__products')
              field: product_id

  
  - name: stg_local_bike__stores
    description: "This model contains stores informations."
    columns:
      - name: store_id
        description: "Primary key, unique identifier for each store."
        tests:
            - unique
            - not_null

